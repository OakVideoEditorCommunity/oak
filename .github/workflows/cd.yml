name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Release packages are built from scratch: CD uses no vcpkg/cargo caches.
# A restored vcpkg_installed or target tree has masked packaging problems
# before (stale ports, missing tools); a release build must not depend on
# restored state.
jobs:
  # ------------------------------------------------------------------
  # Linux: deb + AppImage + pacman in one job. cargo-packager does not
  # support rpm (its format list is deb/appimage/pacman/nsis/dmg/app/wix),
  # and its "pacman" format emits a PKGBUILD + source tarball rather than a
  # compiled pkg.tar.zst — both are upstream limitations.
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # Linux: one native package per distro, each built INSIDE that
  # distro's container so the declared dependencies always resolve to
  # the distro's own package names (dpkg-shlibdeps / rpmbuild
  # auto-requires / Arch static base list). The FFmpeg/codec libraries
  # come from the vcpkg manifest (root vcpkg.json, the distro/arch
  # triplet), so these containers carry the build toolchain and the
  # headless/UI runtime deps only. deb: hand-rolled dpkg-deb, built once
  # in debian:12 (the general Debian-family package, labeled "+debian")
  # and once per openKylin arch (x64/arm64, labeled "+openkylin") so each
  # family gets deps that resolve against its own repos; rpm: rpmbuild;
  # arch: makepkg. AppImage stays on the Ubuntu runner (self-contained by
  # design).
  # ------------------------------------------------------------------
  linux:
    name: Linux packages (${{ matrix.distro }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:12
            arch: x64
            runner: warp-ubuntu-latest-x64-16x
            triplet: x64-linux
          - distro: fedora
            image: fedora:41
            arch: x64
            runner: warp-ubuntu-latest-x64-16x
            triplet: x64-linux
          - distro: arch
            image: archlinux:latest
            arch: x64
            runner: warp-ubuntu-latest-x64-16x
            triplet: x64-linux
          - distro: openkylin
            image: openkylin/openkylin:latest
            arch: x64
            runner: warp-ubuntu-latest-x64-16x
            triplet: x64-linux
          - distro: openkylin
            image: openkylin/openkylin:latest
            arch: arm64
            runner: warp-ubuntu-latest-arm64-32x
            triplet: arm64-linux

    steps:
      # git/curl must land BEFORE actions/checkout runs inside the
      # container.
      - name: Install git and fetch tools
        run: |
          case "${{ matrix.distro }}" in
            debian|openkylin) apt-get update && apt-get install -y git curl ;;
            fedora) dnf install -y git curl ;;
            arch) pacman -Sy --noconfirm git curl ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # The openKylin image runs as root with HOME=/github/home; rustup
      # refuses the euid mismatch and installs a toolchain the later steps
      # cannot find. Pin the whole job to root's home (same as the CI
      # openKylin jobs).
      - name: Pin HOME for rustup (openKylin)
        if: matrix.distro == 'openkylin'
        run: |
          {
            echo "HOME=/root"
            echo "CARGO_HOME=/root/.cargo"
            echo "RUSTUP_HOME=/root/.rustup"
          } >> "$GITHUB_ENV"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          case "${{ matrix.distro }}" in
            debian)
              apt-get update
              apt-get install -y \
                build-essential clang libclang-dev cmake pkg-config nasm \
                git curl zip unzip tar python3 dpkg-dev \
                libpipewire-0.3-dev libspa-0.2-dev libjack-jackd2-dev \
                libasound2-dev libpulse-dev libsndfile1-dev \
                libgl1-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers \
                libvulkan-dev libxkbcommon-dev libxkbcommon-x11-dev \
                gdb xvfb libdrm-dev librsvg2-bin autoconf autoconf-archive automake libtool
              ;;
            fedora)
              dnf install -y \
                gcc gcc-c++ clang clang-devel cmake pkgconf-pkg-config nasm \
                git curl zip unzip tar python3 \
                pipewire-devel jack-audio-connection-kit-devel \
                alsa-lib-devel pulseaudio-libs-devel libsndfile-devel \
                mesa-libGL-devel mesa-vulkan-drivers \
                vulkan-headers vulkan-loader-devel \
                libxkbcommon-devel libxkbcommon-x11-devel \
                rpm-build librsvg2-tools libdrm-devel autoconf autoconf-archive automake libtool
              ;;
            arch)
              pacman -S --needed --noconfirm \
                base-devel clang cmake pkgconf nasm \
                git curl zip unzip tar python \
                pipewire jack2 alsa-lib libpulse libsndfile \
                mesa vulkan-headers vulkan-icd-loader \
                libxkbcommon libxkbcommon-x11 librsvg libdrm autoconf autoconf-archive automake libtool
              ;;
            openkylin)
              # The CI openKylin build set plus dpkg-dev (dpkg-shlibdeps
              # computes the runtime deps) and librsvg2-bin (app icon).
              apt-get update
              apt-get install -y \
                build-essential clang libclang-dev cmake pkg-config nasm \
                git curl zip unzip tar python3 patch xz-utils dpkg-dev \
                libpipewire-0.3-dev libspa-0.2-dev libjack-jackd2-dev \
                libasound2-dev libpulse-dev libsndfile1-dev \
                libgl1-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers \
                libvulkan-dev libxkbcommon-dev libxkbcommon-x11-dev \
                libdrm-dev file librsvg2-bin \
                autoconf autoconf-archive automake libtool
              ;;
          esac

      # ------------------------------------------------------------------
      # vcpkg (manifest mode) — built from scratch, no caches (see the
      # policy note at the top of this file)
      # ------------------------------------------------------------------
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git .cache/vcpkg
          .cache/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "$PWD/.cache/vcpkg" >> "$GITHUB_PATH"
          echo "VCPKG_ROOT=$PWD/.cache/vcpkg" >> "$GITHUB_ENV"

      - name: Install dependencies (vcpkg manifest)
        run: vcpkg install --triplet ${{ matrix.triplet }}

      - name: Configure build environment
        run: |
          {
            echo "CC=clang"
            echo "CXX=clang++"
          } >> "$GITHUB_ENV"
          # tooling/ocio-env.sh: vendored static OCIO everywhere it
          # builds (the [patch.crates-io] ocio-sys tracks shaloong/ocio-rs
          # main, whose vendored sources build on GCC >= 16).
          bash tooling/ocio-env.sh >> "$GITHUB_ENV"
          prefix="$PWD/vcpkg_installed/${{ matrix.triplet }}"
          echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$prefix/tools/pkgconf" >> "$GITHUB_PATH"

      - name: Build (release)
        run: cargo build --release --locked

      - name: Generate app icon (PNG from Oak_Icon.svg)
        run: |
          mkdir -p icons
          if command -v rsvg-convert >/dev/null 2>&1; then
            rsvg-convert -w 512 -h 512 Oak_Icon.svg -o icons/icon.png
          else
            # Defensive: some containers (openKylin) may not carry
            # librsvg2-bin; fall back to the committed 512x512 render.
            cp assets/app-icon.png icons/icon.png
          fi

      - name: Package
        run: |
          set -euo pipefail
          # The release version lives in [workspace.package] of the root
          # Cargo.toml (single source of truth; tags do not carry it).
          VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          case "${{ matrix.distro }}" in
            debian)   tooling/package/build-deb.sh "$VERSION" debian ;;
            openkylin) tooling/package/build-deb.sh "$VERSION" openkylin ;;
            fedora)   tooling/package/build-rpm.sh "$VERSION" ;;
            arch)     tooling/package/build-pkg.sh "$VERSION" ;;
          esac
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: oak-linux-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            target/release/*.deb
            target/release/*.rpm
            target/release/*.pkg.tar.zst
          if-no-files-found: error

  # ------------------------------------------------------------------
  # AppImage (self-contained; cargo-packager on the Ubuntu runner).
  # ------------------------------------------------------------------
  appimage:
    name: Linux AppImage
    runs-on: warp-ubuntu-latest-x64-16x

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # FFmpeg/codec libraries come from the vcpkg manifest (root
          # vcpkg.json); this list is the toolchain vcpkg needs plus the
          # GUI runtime deps the AppImage bundles.
          sudo apt-get install -y \
            build-essential clang libclang-dev cmake pkg-config nasm \
            git curl zip unzip tar python3 \
            librsvg2-bin \
            libpipewire-0.3-dev libspa-0.2-dev libjack-jackd2-dev \
            libasound2-dev libpulse-dev libsndfile1-dev \
            libgl1-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers \
            libvulkan-dev libxkbcommon-dev libxkbcommon-x11-dev libdrm-dev \
            autoconf autoconf-archive automake libtool

      # ------------------------------------------------------------------
      # vcpkg (manifest mode) — built from scratch, no caches (see the
      # policy note at the top of this file)
      # ------------------------------------------------------------------
      - name: Bootstrap vcpkg
        run: |
          # Full clone (no --depth): the manifest pins a builtin-baseline
          # and port trees, and a shallow vcpkg cannot check them out
          # ("failed to unpack tree object ... Try again with a full
          # vcpkg clone").
          git clone https://github.com/microsoft/vcpkg.git .cache/vcpkg
          .cache/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "$PWD/.cache/vcpkg" >> "$GITHUB_PATH"
          echo "VCPKG_ROOT=$PWD/.cache/vcpkg" >> "$GITHUB_ENV"

      - name: Install dependencies (vcpkg manifest)
        run: vcpkg install --triplet x64-linux

      - name: Configure build environment
        run: |
          bash tooling/ocio-env.sh >> "$GITHUB_ENV"
          prefix="$PWD/vcpkg_installed/x64-linux"
          echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$prefix/tools/pkgconf" >> "$GITHUB_PATH"

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Generate app icon (PNG from Oak_Icon.svg)
        run: |
          mkdir -p icons
          rsvg-convert -w 512 -h 512 Oak_Icon.svg -o icons/icon.png
          file icons/icon.png

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package (AppImage)
        run: cargo packager --release --formats appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: oak-linux-appimage
          path: target/release/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS DMG (Apple Silicon)
    runs-on: warp-macos-26-arm64-12x

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          # Homebrew's pkgconf installs a `pkg-config` symlink, which is
          # the name crates/oak-ffmpeg-link/build.rs invokes; nasm is what
          # vcpkg's ffmpeg port requires to build. librsvg stays for
          # rsvg-convert (app icon) and is bundled into the .app below.
          brew install cmake pkg-config nasm librsvg nasm autoconf automake libtool autoconf-archive

      # ------------------------------------------------------------------
      # vcpkg (manifest mode) — built from scratch, no caches (see the
      # policy note at the top of this file)
      # ------------------------------------------------------------------
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git .cache/vcpkg
          .cache/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "$PWD/.cache/vcpkg" >> "$GITHUB_PATH"
          echo "VCPKG_ROOT=$PWD/.cache/vcpkg" >> "$GITHUB_ENV"

      - name: Install dependencies (vcpkg manifest)
        run: vcpkg install --triplet arm64-osx

      - name: Configure build environment
        run: |
          # Vendored static OCIO (same as every non-Windows platform via
          # tooling/ocio-env.sh); no OCIO_INSTALL_DIR override.
          bash tooling/ocio-env.sh >> "$GITHUB_ENV"
          prefix="$PWD/vcpkg_installed/arm64-osx"
          echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$prefix/tools/pkgconf" >> "$GITHUB_PATH"

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Generate app icon (PNG from Oak_Icon.svg)
        run: |
          mkdir -p icons
          # cargo-packager's tauri-icns 0.1.0 maps only 512x512@1x (and
          # 1024x1024@2x); a plain 1024x1024 PNG aborts with "No matching
          # IconType", so render 512x512.
          rsvg-convert -w 512 -h 512 Oak_Icon.svg -o icons/icon.png
          file icons/icon.png

      # Build the packaged binaries (default members: the app, oak-cli,
      # oak-worker).
      - name: Build (release)
        run: cargo build --release --locked

      - name: Package .app bundle
        run: cargo packager --release --formats app

      # Pull the Homebrew dylibs the binaries reference into
      # Contents/Frameworks and rewrite install names to
      # @executable_path-relative (the script ad-hoc re-signs the bundle).
      - name: Bundle dylibs into the .app
        run: tooling/package/bundle-dylibs-macos.sh target/release/Oak.app

      - name: Create DMG
        run: |
          rm -rf dmg-staging
          mkdir -p dmg-staging
          cp -R target/release/Oak.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Oak Video Editor" \
            -srcfolder dmg-staging -ov -format UDZO Oak-macOS-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: oak-macos
          path: Oak-macOS-arm64.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Windows: NSIS installer (restored; cargo-packager downloads its own
  # makensis, SHA-1 verified). The obsolete `-p oakengine` cdylib prebuild
  # from before M14 R4 is dropped — no packaged binary links the cdylib.
  # ------------------------------------------------------------------
  windows:
    name: Windows installer (NSIS)
    runs-on: warp-windows-2025-vs2026-x64-32x

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # Defender's real-time scanning slows the MSVC/vcpkg build down
      # badly; disable it for the job and keep exclusions as the fallback
      # when policy blocks the change (same step as the CI Windows job).
      - name: Disable Windows Defender scanning
        shell: pwsh
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
            Set-MpPreference -DisableScriptScanning $true -ErrorAction SilentlyContinue
            Set-MpPreference -DisableArchiveScanning $true -ErrorAction SilentlyContinue
            Write-Host "Windows Defender real-time scanning disabled for this job"
          } catch {
            Write-Host "Windows Defender could not be disabled (non-fatal, falling back to exclusions): $_"
          }
          foreach ($path in @(
            $env:GITHUB_WORKSPACE,
            "$env:USERPROFILE\.cargo",
            "$env:USERPROFILE\.rustup",
            "$env:LOCALAPPDATA\vcpkg"
          )) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          }
          try {
            Get-MpPreference |
              Select-Object DisableRealtimeMonitoring, DisableScriptScanning, ExclusionPath |
              Format-List
          } catch {
            Write-Host "Defender status unavailable: $_"
          }

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          # The Windows build is MSVC-ABI (the runner carries VS 2026):
          # vcpkg's FFmpeg and the vendored OCIO build both want it.
          toolchain: stable-x86_64-pc-windows-msvc

      # vcpkg.json at the repo root pins the dependency set (FFmpeg with
      # every free codec + hwaccel, pkgconf, librsvg); the resolved tree
      # lands in vcpkg_installed/ and is built from scratch (no cache, see
      # the policy note at the top). Bootstrapping a fresh clone rather
      # than leaning on whatever vcpkg the image carries: the
      # `builtin-baseline`/`overrides` are only honored by a recent
      # vcpkg-tool, and every OS job must behave alike.
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\.cache\vcpkg"
          & "$env:GITHUB_WORKSPACE\.cache\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE\.cache\vcpkg" >> $env:GITHUB_PATH
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\.cache\vcpkg" >> $env:GITHUB_ENV

      - name: Install dependencies (vcpkg manifest)
        run: vcpkg install --triplet x64-windows

      - name: Configure build environment
        run: |
          $prefix = "$env:GITHUB_WORKSPACE\vcpkg_installed\x64-windows"
          "FFMPEG_DIR=$prefix" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$prefix\lib\pkgconfig" >> $env:GITHUB_ENV
          "$prefix\tools\pkgconf" >> $env:GITHUB_PATH
          # Bundled OCIO: ocio-sys' vendored sources build with the MSVC
          # toolchain (what they need — the MSYS2 package was the
          # workaround, not the preference), so no OCIO_INSTALL_DIR and
          # no OCIO_RS_NO_MSVC_INCLUDES anywhere.
          "OCIO_RS_ENABLE_REAL=1" >> $env:GITHUB_ENV
          "OCIO_RS_LINK=static" >> $env:GITHUB_ENV
          vcpkg list

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Generate app icon (PNG from Oak_Icon.svg)
        run: |
          # vcpkg's librsvg port builds with -Drsvg-convert=disabled (it
          # ships the library only and provides no rsvg-convert.exe), so
          # use the committed 512x512 render of Oak_Icon.svg.
          New-Item -ItemType Directory -Force icons | Out-Null
          Copy-Item assets/app-icon.png icons/icon.png

      - name: Build (release)
        run: |
          # Static CRT: the installer then needs no vcruntime DLLs (the
          # vcpkg DLLs below are the only runtime pieces to bundle).
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --release --locked

      # The vcpkg runtime DLLs (avcodec/avformat/... and the codec libs)
      # ship next to the executables: copy them into target/pkg/win-dlls,
      # which the packager `resources` glob installs alongside (the MSVC
      # CRT itself is covered by the toolchain's static linking story;
      # OCIO is bundled statically).
      - name: Bundle runtime DLLs
        run: |
          New-Item -ItemType Directory -Force target/pkg/win-dlls | Out-Null
          Copy-Item "vcpkg_installed\x64-windows\bin\*.dll" target/pkg/win-dlls/

      - name: Package (NSIS)
        run: cargo packager --release --formats nsis

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: oak-windows
          path: target/release/*-setup.exe
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Publish: attach every platform package to the v* tag's GitHub release
  # (skipped on workflow_dispatch, which only uploads artifacts).
  # ------------------------------------------------------------------
  release:
    name: Publish GitHub release
    needs: [linux, appimage, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          files: artifacts/*

