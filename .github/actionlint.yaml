# actionlint configuration (dev tooling; not used by GitHub Actions).
#
# WarpBuild's runner labels are not in actionlint's built-in list; declare
# the sizes this repository uses so `actionlint` stops warning about them.
self-hosted-runner:
  labels:
    - warp-ubuntu-latest-x64-8x
    - warp-ubuntu-latest-x64-16x
    - warp-ubuntu-latest-x64-32x
    - warp-ubuntu-latest-arm64-16x
    - warp-ubuntu-latest-arm64-32x
    - warp-macos-26-arm64-6x
    - warp-macos-26-arm64-12x
    - warp-windows-2025-vs2026-x64-16x
    - warp-windows-2025-vs2026-x64-32x
