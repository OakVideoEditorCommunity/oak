[package]

name = "sdk_editor"
version = "0.1.0"
edition = "2024"
publish = false
description = "Independent Oak SDK consumer example: headless editing workflow and a minimal GUI shell"
license = "GPL-3.0-or-later"
repository = "https://github.com/oakvideoeditor/oak"

[dependencies]
# The ONLY Oak dependency: the example proves a new editor can be built on
# the public Rust SDK without any other Oak crate.
quercus-engine-rs = { version = "=0.5.7" }
[features]
default = []

[[bin]]
name = "sdk_editor"
path = "src/main.rs"

[lib]
name = "sdk_editor"
path = "src/lib.rs"
