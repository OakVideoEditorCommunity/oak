[package]
name = "oak-worker"
version.workspace = true
edition = "2021"
description = "Oak Video Editor headless render worker process (Rust)"
license = "GPL-3.0-or-later"

[[bin]]
name = "oak-worker"
path = "src/main.rs"

[dependencies]
# The worker runtime (protocol, shm slots, eval) is an engine capability; the
# binary is a thin launcher through the SDK like every other Oak consumer.
quercus-engine-rs = { version = "=0.5.7" }
