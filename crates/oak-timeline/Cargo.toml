[package]
name = "oak-timeline"
version.workspace = true
edition = "2021"
description = "Oak Video Editor timeline edit primitives (Rust)"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
oak-core = { version = "=0.5.2", path = "../oak-core" }
oak-undo = { version = "=0.5.2", path = "../oak-undo" }
oak-node = { version = "=0.5.2", path = "../oak-node" }
# Error trait derive for the crate-internal error enum.
thiserror = "2"
