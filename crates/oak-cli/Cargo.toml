[package]
name = "oak-cli"
version.workspace = true
edition = "2021"
description = "Oak Video Editor headless command-line consumer of the oak editor module crates (Rust)"
license = "GPL-3.0-or-later"

[[bin]]
name = "oak-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# The CLI is a pure SDK consumer: project/timeline queries, edits, frames,
# audio, probe/transcode and export all cross the oak-engine C ABI through
# the safe Rust wrapper. It links no other Oak crate.
oak-engine-rust-sdk = { path = "../oak-engine-rust-sdk" }
