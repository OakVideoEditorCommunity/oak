[package]
name = "oak-engine-rust-sdk"
edition = "2024"
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Safe Rust SDK for the Oak video engine: editor sessions, semantic edits, preview, media and OFX"
readme = "README.md"
keywords = ["video", "editor", "media", "nle", "ffmpeg"]
categories = ["multimedia::video", "api-bindings"]
include = ["src/**/*.rs", "README.md", "Cargo.toml"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.release]
publish-order = 2

[lib]
crate-type = ["rlib"]

[dependencies]
thiserror = "2"
# The engine is a cdylib which the SDK links dynamically (`#[link]`) and
# talks to only through its exported `extern "C"` symbols — no Rust API
# of the engine is used. The dependency edge makes cargo build the dylib
# into the dependency search path before anything links the SDK.
oak-engine = { version = "=0.5.2", path = "../oak-engine" }
